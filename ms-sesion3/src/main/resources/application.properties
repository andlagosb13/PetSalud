spring.application.name=semana5

# Configuración de H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ejemplo in-memory (útil para desarrollo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP (ajustes recomendados)
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool

# JPA / Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuraciones adicionales
spring.session.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.platform=oracle

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name="Mi microservicio de ejemplo"
info.app.description="Este es un microservicio de ejemplo para demostrar el uso de Spring Boot y Oracle Database."
info.app.version=1.0.0


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
# Cuenta de demostración: exige contraseña suministrada fuera de Git
app.seed.admin-password=${ADMIN_SEED_PASSWORD}
